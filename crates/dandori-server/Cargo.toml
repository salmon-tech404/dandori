[package]
name = "dandori-server"
description = "Điểm khởi động máy chủ và composition root của ứng dụng Dandori"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# Có hai chương trình (dandori và generate_types); `cargo run -p dandori-server` chạy máy chủ.
default-run = "dandori"

[[bin]]
name = "dandori"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dandori-types = { workspace = true }
dandori-db = { workspace = true }
dandori-events = { workspace = true }
dandori-vault = { workspace = true }
dandori-process = { workspace = true }
dandori-agent-port = { workspace = true }
dandori-agent-adapters = { workspace = true }
dandori-git = { workspace = true }
dandori-module-api = { workspace = true }
dandori-registry = { workspace = true }
dandori-modules = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
